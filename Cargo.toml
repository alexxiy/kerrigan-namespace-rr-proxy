[package]
name = "pivx-name-rr-proxy"
version = "0.2.0"
edition = "2024"

[[bin]]
name = "rr-proxy"
path = "src/main.rs"

[dependencies]
rocksdb = "0.24.0"

# The protocol's hash rules — leaf hashing, node hashing and path derivation — come from
# the same crate the prover's guest circuit uses. Agreement with the circuit is therefore a
# compile-time property rather than a convention maintained by hand, which is what the
# `proof_verifies_under_the_provers_traversal` and `registration_proofs_agree_with_the_circuit`
# tests pin down.
#
# default-features = false: this daemon only speaks the tree. The address-validation
# (bech32) and signature (ed25519-dalek) stacks are the circuit's business and
# are compiled out here.
#
# NOTE: a path dependency ties this build to the prover checkout sitting beside it.
# For deployment, switch to a git dependency pinned to a tag so the daemon and the
# on-chain vKey are provably built from the same protocol revision.
pins-core = { path = "../pivx-name-prover/pins-core", default-features = false }
# Only the runtime pieces this daemon actually uses.
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "macros",
    "signal",
    "sync",
    "time",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# For configuration parsing
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.3"
# CLI parser
clap = { version = "4.6.4", features = ["derive"] }

[dev-dependencies]
# Used only to emit cross-check vectors for the PHP client (see the ignored
# dump_php_proof_vectors test); the daemon itself speaks binary, not JSON.
serde_json = "1.0"
# Time control for tests that would otherwise have to wait out real timeouts.
# Dev-only, so the shipped binary keeps the narrowed feature set above.
tokio = { version = "1.53.1", features = ["test-util"] }

[profile.release]
lto = true
codegen-units = 1
