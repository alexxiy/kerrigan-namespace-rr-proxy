[package]
name = "rr-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
rocksdb = "0.24.0"
tokio = { version = "1.50.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
# For configuration parsing
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"
# CLI parser
clap = { version = "4.6.0", features = ["derive"] }
